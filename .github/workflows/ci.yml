# CI: carga do banco e testes (pytest + AppTest do Streamlit)
name: CI
on:
  push:
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python scripts/popular_banco.py
      - run: pytest -q

  # Fluxo principal e acessibilidade com o app no ar, num navegador real (issue #6)
  tela:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-tela.txt
      - run: pip list | grep -i -E "^(playwright|pytest-playwright|axe-playwright-python|streamlit) "
      - run: python scripts/popular_banco.py
      - run: python -m playwright install --with-deps chromium
      - name: Subir o app
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8501/_stcore/health && exit 0; sleep 2; done
          cat streamlit.log; exit 1
      - run: pytest tela -v -s
        env:
          APP_URL: http://localhost:8501
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tela-saida
          path: tela-saida/
